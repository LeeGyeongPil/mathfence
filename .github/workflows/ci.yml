# Pure string processing: no keys, no network after the dependencies are installed.
# Dependencies come from uv.lock, so a scheduled run would only repeat the same test.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install "uv==0.13.9"
      - name: Show versions and the checked-out files
        run: |
          python -VV
          uv --version
          git log -1 --format='%H %s'
          git ls-files | wc -l
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run python bench/compare.py
