# Pure string processing: no keys, no network after the dependencies are installed.
# Dependencies come from uv.lock, so a scheduled run would only repeat the same test.
# Every step also writes its output to $RUNNER_TEMP/ci-logs; the last step always runs
# and puts the step results and the tail of a failing step's output into the job summary.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    # An explicit "bash" makes the runner use "bash -eo pipefail", so "cmd | tee log"
    # still fails the step when cmd fails.
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    env:
      # Never let uv fetch another interpreter: the matrix Python must be the one tested.
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        id: setup
        with:
          python-version: ${{ matrix.python }}
      - name: Point uv at the matrix Python
        run: echo "UV_PYTHON=${{ steps.setup.outputs.python-path }}" >> "$GITHUB_ENV"
      - name: Install uv
        id: install
        run: |
          mkdir -p "$RUNNER_TEMP/ci-logs"
          python -m pip install "uv==0.13.9" 2>&1 | tee "$RUNNER_TEMP/ci-logs/install.log"
      - name: Show versions and the checked-out files
        id: versions
        run: |
          {
            uname -sm
            python -VV
            uv --version
            echo "UV_PYTHON=$UV_PYTHON"
            echo "LANG=${LANG-unset} LC_ALL=${LC_ALL-unset}"
            git log -1 --format='%H %s'
            echo "tracked files: $(git ls-files | wc -l)"
          } 2>&1 | tee "$RUNNER_TEMP/ci-logs/versions.log"
      - name: uv sync --locked
        id: sync
        run: |
          {
            uv sync --locked
            echo "project environment: $(.venv/bin/python -c 'import sys; print(sys.version.split()[0])')"
          } 2>&1 | tee "$RUNNER_TEMP/ci-logs/sync.log"
      - name: uv run pytest -q
        id: test
        run: uv run pytest -q 2>&1 | tee "$RUNNER_TEMP/ci-logs/test.log"
      - name: uv run python bench/compare.py
        id: bench
        run: uv run python bench/compare.py 2>&1 | tee "$RUNNER_TEMP/ci-logs/bench.log"
      - name: Job summary
        if: always()
        env:
          PY: ${{ matrix.python }}
          INSTALL: ${{ steps.install.outcome }}
          VERSIONS: ${{ steps.versions.outcome }}
          SYNC: ${{ steps.sync.outcome }}
          TEST: ${{ steps.test.outcome }}
          BENCH: ${{ steps.bench.outcome }}
        run: |
          logs="$RUNNER_TEMP/ci-logs"
          {
            echo "### Python $PY"
            echo
            echo "| step | outcome |"
            echo "|---|---|"
            echo "| install uv | ${INSTALL:-not run} |"
            echo "| show versions | ${VERSIONS:-not run} |"
            echo "| uv sync --locked | ${SYNC:-not run} |"
            echo "| uv run pytest -q | ${TEST:-not run} |"
            echo "| bench/compare.py | ${BENCH:-not run} |"
            if [ -f "$logs/versions.log" ]; then
              echo
              echo '```'
              cat "$logs/versions.log"
              echo '```'
            fi
            for step in install versions sync test bench; do
              var=$(echo "$step" | tr '[:lower:]' '[:upper:]')
              if [ "${!var}" = "failure" ] && [ -f "$logs/$step.log" ]; then
                echo
                echo "#### $step failed (last 60 lines)"
                echo '```'
                tail -n 60 "$logs/$step.log"
                echo '```'
              fi
            done
            if [ "$INSTALL" != "success" ] && [ "$INSTALL" != "failure" ]; then
              echo
              echo "No command ran: checkout or setup-python failed first. Open that step's log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
